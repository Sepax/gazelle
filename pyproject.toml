[project]
name = "gazelle"
version = "0.1.0"
description = "Appearance-based gaze estimation from face images, trained on MPIIFaceGaze."
readme = "README.md"
authors = [
    { name = "Sebastian Pålsson", email = "seb.plson@gmail.com" },
    { name = "Erik Green", email = "erik.green@example.com" },
]
requires-python = ">=3.12"
dependencies = [
    "lightning>=2.6.6",
    "omegaconf>=2.3.1",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "tensorboard>=2.21.0",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lightning noise from the test environment: tests deliberately run on CPU with
# num_workers=0, and some fit without a val loader. Keep real warnings visible.
filterwarnings = [
    "ignore:GPU available but not used",
    "ignore:You defined a `validation_step`",
    "ignore:The .* does not have many workers",
    "ignore:`isinstance\\(treespec, LeafSpec\\)` is deprecated",
]

[tool.ruff]
extend-exclude = ["src/gazelle/data/gazehub"]

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
